[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bankops-copilot"
version = "1.0.0"
description = "Evidence-backed treasury analysis with bounded LangGraph workflows, SQL and RAG"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Jaber Mobarak"}]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "langgraph>=1.0,<2",
  "httpx>=0.27,<1", "scikit-learn>=1.5,<2", "python-dotenv>=1,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
gigachat = ["langchain-gigachat>=0.3,<1"]
semantic = ["sentence-transformers>=3,<6", "qdrant-client>=1.12,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "qdrant-client>=1.12,<2"]

[tool.setuptools]
packages = ["bankops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
